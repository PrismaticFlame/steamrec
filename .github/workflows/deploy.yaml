name: deploy
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: 
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2
      - name: Upload hashed assets (cache for a year)
        run: |
          aws s3 sync frontend/dist/assets s3://${{ secrets.S3_BUCKET }}/assets \
            --cache-control "public,max-age=31536000,immutable"
      - name: Upload everything else (always revalidate)
        run: |
          aws s3 sync frontend/dist s3://${{ secrets.S3_BUCKET }} \
            --exclude "assets/*" --delete --cache-control "no-cache"
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} \
            --paths "/index.html" "/"

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2
      - name: Send deploy command
        id: send
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name AWS-RunShellScript \
            --parameters '{"commands":["sudo -u ubuntu -H git -C /home/ubuntu/steamrec pull --ff-only",
                                       "sudo -u ubuntu -H docker compose -f /home/ubuntu/steamrec/docker-compose.prod.yml up -d --build",
                                       "sudo -u ubuntu -H docker image prune -f"]}' \
            --query Command.CommandId --output text)
          echo "cmd_id=$CMD_ID" >> "$GITHUB_OUTPUT"
      - name: Wait for result
        run: |
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id ${{ steps.send.outputs.cmd_id }} \
              --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut) exit 1 ;;
            esac
            sleep 10
          done
          exit 1
