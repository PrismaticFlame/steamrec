name: deploy
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: 
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2
      - name: Upload hashed assets (cache for a year)
        run: |
          aws s3 sync frontend/dist/assets s3://${{ secrets.S3_BUCKET }}/assets \
            --cache-control "public,max-age=31536000,immutable"
      - name: Upload everything else (always revalidate)
        run: |
          aws s3 sync frontend/dist s3://${{ secrets.S3_BUCKET }} \
            --exclude "assets/*" --delete --cache-control "no-cache"
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} \
            --paths "/index.html" "/"
